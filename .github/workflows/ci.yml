name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: scbd/drupal-docker-wrapper
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Run lint script
        run: |
          chmod +x ci/lint.sh
          ci/lint.sh

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build Drupal 11 image
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build -t "$IMAGE_NAME:11-ci-$TAG" .

      - name: Smoke test Drupal 11 image
        run: |
          chmod +x ci/smoke-test.sh || true
          TAG="$IMAGE_NAME:11-ci-${GITHUB_SHA::12}"
          bash ci/smoke-test.sh "$TAG"

