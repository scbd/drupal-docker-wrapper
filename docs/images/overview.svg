<svg xmlns='http://www.w3.org/2000/svg' width='620' height='220' viewBox='0 0 620 220' role='img' aria-labelledby='title desc'>
<title id='title'>Drupal Docker Wrapper Overview</title>
<desc id='desc'>Simplified architecture: Base Drupal Images, Custom Modules, CI Pipeline, and Deployment target.</desc>
<style>
  .box { fill:#0b6fa4; stroke:#034463; stroke-width:2; rx:6; ry:6; }
  .text { font:14px system-ui, Arial, sans-serif; fill:#fff; font-weight:500; }
  .arrow { stroke:#444; stroke-width:2; marker-end:url(#arrowhead); }
</style>
<defs>
  <marker id='arrowhead' markerWidth='10' markerHeight='7' refX='10' refY='3.5' orient='auto'>
    <polygon points='0 0, 10 3.5, 0 7' fill='#444'/>
  </marker>
</defs>
<!-- Drupal 11 Box (primary image) -->
<rect class='box' x='120' y='60' width='160' height='100'/>
<text class='text' x='200' y='105' text-anchor='middle'>Drupal 11</text>
<text class='text' x='200' y='125' text-anchor='middle'>Base Image</text>

<!-- CI Build Box -->
<rect class='box' x='420' y='20' width='180' height='80' fill='#1d8237'/>
<text class='text' x='510' y='55' text-anchor='middle'>CI Build &amp;</text>
<text class='text' x='510' y='75' text-anchor='middle'>Smoke Tests</text>

<!-- Docker Hub Box -->
<rect class='box' x='420' y='130' width='180' height='70' fill='#8a4f0f'/>
<text class='text' x='510' y='160' text-anchor='middle'>Docker Hub /</text>
<text class='text' x='510' y='180' text-anchor='middle'>Registry</text>

<!-- Arrows -->
<line class='arrow' x1='280' y1='110' x2='420' y2='60'/>
<line class='arrow' x1='510' y1='100' x2='510' y2='130'/>
</svg>
